name: PR Standard

# Deployed by tomb-of-nazarick (fortify), together with .github/scripts/check_pr_standard.py,
# its tests, and .github/PR_STANDARD.md. Edit the source in the tomb (actions/pr-standard),
# then re-run fortify; a private action cannot be called from a public repository, so the
# checker is shipped as a copy. Make "PR Standard / body" a required status check on main.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-standard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    name: body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the checker
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Collect changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${REPO}/pulls/${PR}/files" --jq '.[].filename' > "${RUNNER_TEMP}/changed.txt"
          echo "$(wc -l < "${RUNNER_TEMP}/changed.txt") changed file(s)"

      - name: Write PR body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/body.md"

      - name: Check the body against the standard
        id: check
        env:
          PR_STANDARD_BLOCKED_DOMAINS: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          set +e
          python3 .github/scripts/check_pr_standard.py \
            --body "${RUNNER_TEMP}/body.md" --files "${RUNNER_TEMP}/changed.txt" --summary "${RUNNER_TEMP}/summary.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or refresh the report on the PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-standard-report -->';
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the body does not meet the standard
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::PR body does not meet .github/PR_STANDARD.md (see the job summary)."
          exit 1
