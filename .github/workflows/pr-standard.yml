name: PR Standard

# Deployed by tomb-of-nazarick (fortify). The rules live in .github/PR_STANDARD.md;
# the checker lives in the tomb's actions/pr-standard, so a rule change lands once.
# Make this a required status check on main: "PR Standard / body".
#
# The tomb is a private repository: under its Settings -> Actions -> General ->
# Access, allow "repositories owned by the user", or this `uses:` cannot resolve.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-standard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    name: body
    runs-on: ubuntu-latest
    steps:
      - uses: freddieweir/tomb-of-nazarick/actions/pr-standard@main
        with:
          blocked-domains: ${{ vars.PRODUCTION_DOMAIN }}
