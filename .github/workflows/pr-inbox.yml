name: PR Inbox

# Deployed by tomb-of-nazarick (fortify). Assigns every pull request to the
# repository owner on open, reopen and ready-for-review; CODEOWNERS covers the
# review request.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-owner:
    name: assign owner
    runs-on: ubuntu-latest
    steps:
      - uses: freddieweir/tomb-of-nazarick/actions/pr-inbox@main
