name: PR Inbox

# Deployed by tomb-of-nazarick (fortify). Assigns every pull request to the
# repository owner on open, reopen and ready-for-review; CODEOWNERS covers the
# review request. Inline rather than an action call, so it works in public
# repositories too (a private action cannot be called from a public repository).

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-owner:
    name: assign owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            if ((pr.assignees || []).some(a => a.login === owner)) { core.info(`${owner} already assigned`); return; }
            await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees: [owner] });
            core.info(`assigned ${owner} to #${pr.number}`);
